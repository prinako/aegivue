services:
  aegivue-postgres:
    ports: ["127.0.0.1:5432:5432"]
  aegivue-api:
    build:
      context: ./apps/api
      target: build
    command: ["npm","run","dev"]
    volumes: [./apps/api/src:/src/src:ro]
  aegivue-media:
    build:
      context: .
      dockerfile: crates/media-engine/Dockerfile
  aegivue-web:
    build:
      context: ./apps/web
