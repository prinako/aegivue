server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve Compose service names at request time. This keeps Nginx running
  # while an upstream container is being recreated or has not registered in
  # Docker DNS yet.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api_upstream http://vigilo-api:3000;
  set $media_upstream http://vigilo-media:3010;

  location /api/ {
    proxy_pass $api_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /live/ {
    proxy_pass $media_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
  }

  # Flutter generated JS/WASM/static assets must exist.
  location ~* \.(js|mjs|wasm|map|json|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
    try_files $uri =404;
  }

  # Flutter SPA routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
