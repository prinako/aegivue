server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve Compose service names at request time. This keeps Nginx running
  # while an upstream container is being recreated or has not registered in
  # Docker DNS yet.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api_upstream http://aegivue-api:3000;
  set $webrtc_upstream http://aegivue-webrtc:8889;
  set $hls_upstream http://aegivue-webrtc:8888;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_buffering off;
    proxy_cache off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Dashboard data is dynamic. Do not let the browser or an intermediary
    # reuse an old cameras/recordings response after a mutation.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }

  # WHEP handshake. Media packets themselves use the WebRTC ICE port (8189/udp).
  location /webrtc/ {
    rewrite ^/webrtc/(.*)$ /$1 break;
    proxy_pass $webrtc_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }

  # HLS remains available as an automatic browser fallback when WebRTC/ICE fails.
  location /live/ {
    rewrite ^/live/(.*)$ /$1 break;
    proxy_pass $hls_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
  }

  # Flutter generated JS/WASM/static assets must exist.
  location ~* \.(js|mjs|wasm|map|json|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
    try_files $uri =404;
  }

  # Flutter SPA routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
