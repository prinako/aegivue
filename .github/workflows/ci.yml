name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm --prefix apps/api run typecheck
      - run: npm --prefix apps/api run lint
      - run: npm --prefix apps/api run format:check
      - run: npm --prefix apps/api test
      - run: npm --prefix apps/api run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/web
      - name: Print canonical camera UI formatting
        working-directory: apps/web
        run: |
          dart format lib/features/cameras/domain/camera.dart lib/features/cameras/presentation/camera_settings_page.dart lib/main.dart
          echo '===== CAMERA.DART ====='
          cat lib/features/cameras/domain/camera.dart
          echo '===== CAMERA_SETTINGS_PAGE.DART ====='
          cat lib/features/cameras/presentation/camera_settings_page.dart
          echo '===== MAIN.DART ====='
          cat lib/main.dart
