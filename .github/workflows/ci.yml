name: CI
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --prefix apps/api
      - run: npm --prefix apps/api run typecheck
      - run: npm --prefix apps/api run lint
      - run: npm --prefix apps/api run format:check
      - run: npm --prefix apps/api test
      - run: npm --prefix apps/api run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/web
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: apps/web
      - run: flutter analyze
        working-directory: apps/web
      - run: flutter test
        working-directory: apps/web
      - run: flutter build web --release
        working-directory: apps/web
      - name: Verify Flutter commands leave repository clean
        run: |
          git status --short
          git diff -- apps/web/pubspec.lock
          test -z "$(git status --porcelain --untracked-files=all)"
