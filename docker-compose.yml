name: vigilo
services:
  vigilo-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vigilo
      POSTGRES_USER: vigilo
      POSTGRES_PASSWORD: ${VIGILO_POSTGRES_PASSWORD:?set VIGILO_POSTGRES_PASSWORD}
    volumes: [vigilo-postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U vigilo -d vigilo"], interval: 10s, timeout: 5s, retries: 5}
    networks: [vigilo-internal]
  vigilo-migrate:
    image: postgres:17-alpine
    depends_on: {vigilo-postgres: {condition: service_healthy}}
    environment:
      VIGILO_DATABASE_URL: postgres://vigilo:${VIGILO_POSTGRES_PASSWORD}@vigilo-postgres:5432/vigilo
    volumes: [./database/migrations:/migrations:ro, ./database/migrate.sh:/migrate.sh:ro]
    command: ["sh","/migrate.sh"]
    networks: [vigilo-internal]
  vigilo-api:
    image: ghcr.io/prinako/vigilo-api:${VIGILO_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on: {vigilo-migrate: {condition: service_completed_successfully}}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      VIGILO_DATABASE_URL: postgres://vigilo:${VIGILO_POSTGRES_PASSWORD}@vigilo-postgres:5432/vigilo
      VIGILO_API_HOST: 0.0.0.0
      VIGILO_API_PORT: 3000
      VIGILO_LOG_LEVEL: ${VIGILO_LOG_LEVEL:-info}
      VIGILO_MEDIA_URL: http://vigilo-media:3010
      VIGILO_STORAGE_PATH: /data/recordings
      VIGILO_RECORDING_SEGMENT_SECONDS: ${VIGILO_RECORDING_SEGMENT_SECONDS:-60}
      VIGILO_TRUST_PROXY: ${VIGILO_TRUST_PROXY:-false}
    ports: ["${VIGILO_API_BIND:-127.0.0.1}:3000:3000"]
    volumes: [vigilo-recordings:/data/recordings:ro]
    healthcheck: {test: [CMD, "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"], interval: 10s, timeout: 3s, retries: 5}
    networks: [vigilo-internal, vigilo-public]
  vigilo-media:
    image: ghcr.io/prinako/vigilo-media:${VIGILO_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      vigilo-migrate: {condition: service_completed_successfully}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      VIGILO_DATABASE_URL: postgres://vigilo:${VIGILO_POSTGRES_PASSWORD}@vigilo-postgres:5432/vigilo
      VIGILO_LOG_LEVEL: ${VIGILO_LOG_LEVEL:-info}
      VIGILO_MEDIA_BIND: 0.0.0.0:3010
      VIGILO_STORAGE_PATH: /data/recordings
    volumes: [vigilo-recordings:/data/recordings]
    healthcheck: {test: [CMD, "wget", "-q", "--spider", "http://127.0.0.1:3010/internal/v1/ready"], interval: 10s, timeout: 3s, retries: 5}
    restart: unless-stopped
    networks: [vigilo-internal, vigilo-cameras]
  vigilo-web:
    image: ghcr.io/prinako/vigilo-web:${VIGILO_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      vigilo-api: {condition: service_healthy}
    ports: ["${VIGILO_WEB_BIND:-127.0.0.1}:8080:80"]
    networks: [vigilo-public]
networks:
  vigilo-internal: {internal: true}
  vigilo-public: {}
  vigilo-cameras: {}
volumes:
  vigilo-postgres-data: {}
  vigilo-recordings: {}
