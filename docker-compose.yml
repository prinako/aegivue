name: aegivue
services:
  aegivue-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegivue
      POSTGRES_USER: aegivue
      POSTGRES_PASSWORD: ${AEGIVUE_POSTGRES_PASSWORD:?set AEGIVUE_POSTGRES_PASSWORD}
    volumes: [aegivue-postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U aegivue -d aegivue"], interval: 10s, timeout: 5s, retries: 5}
    networks: [aegivue-internal]

  aegivue-migrate:
    image: postgres:17-alpine
    depends_on: {aegivue-postgres: {condition: service_healthy}}
    environment:
      AEGIVUE_DATABASE_URL: postgres://aegivue:${AEGIVUE_POSTGRES_PASSWORD}@aegivue-postgres:5432/aegivue
    volumes: [./database/migrations:/migrations:ro, ./database/migrate.sh:/migrate.sh:ro]
    command: ["sh","/migrate.sh"]
    networks: [aegivue-internal]

  aegivue-api:
    image: ghcr.io/prinako/aegivue-api:${AEGIVUE_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on: {aegivue-migrate: {condition: service_completed_successfully}}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      AEGIVUE_DATABASE_URL: postgres://aegivue:${AEGIVUE_POSTGRES_PASSWORD}@aegivue-postgres:5432/aegivue
      AEGIVUE_API_HOST: 0.0.0.0
      AEGIVUE_API_PORT: 3000
      AEGIVUE_LOG_LEVEL: ${AEGIVUE_LOG_LEVEL:-info}
      AEGIVUE_MEDIA_URL: http://aegivue-media:3010
      AEGIVUE_STORAGE_PATH: /data/recordings
      AEGIVUE_RECORDING_SEGMENT_SECONDS: ${AEGIVUE_RECORDING_SEGMENT_SECONDS:-60}
      AEGIVUE_TRUST_PROXY: ${AEGIVUE_TRUST_PROXY:-false}
    ports: ["${AEGIVUE_API_BIND:-127.0.0.1}:3000:3000"]
    volumes: [aegivue-recordings:/data/recordings:ro]
    healthcheck: {test: [CMD, "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"], interval: 10s, timeout: 3s, retries: 5}
    networks: [aegivue-internal, aegivue-public]

  aegivue-webrtc:
    image: bluenviron/mediamtx:1.19.3
    restart: unless-stopped
    environment:
      MTX_LOGLEVEL: ${AEGIVUE_LOG_LEVEL:-info}
      MTX_RTSPTRANSPORTS: tcp
      MTX_WEBRTCADDITIONALHOSTS: ${AEGIVUE_WEBRTC_HOST:-127.0.0.1}
      MTX_WEBRTCLOCALUDPADDRESS: :8189
      MTX_HLSVARIANT: lowLatency
      MTX_HLSSEGMENTDURATION: 1s
      MTX_HLSPARTDURATION: 200ms
    ports:
      - "${AEGIVUE_WEBRTC_ICE_BIND:-0.0.0.0}:8189:8189/udp"
    networks: [aegivue-stream]

  aegivue-media:
    image: ghcr.io/prinako/aegivue-media:${AEGIVUE_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      aegivue-migrate: {condition: service_completed_successfully}
      aegivue-webrtc: {condition: service_started}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      AEGIVUE_DATABASE_URL: postgres://aegivue:${AEGIVUE_POSTGRES_PASSWORD}@aegivue-postgres:5432/aegivue
      AEGIVUE_LOG_LEVEL: ${AEGIVUE_LOG_LEVEL:-info}
      AEGIVUE_MEDIA_BIND: 0.0.0.0:3010
      AEGIVUE_STORAGE_PATH: /data/recordings
      AEGIVUE_LIVE_PATH: /tmp/aegivue-live
      AEGIVUE_WEBRTC_PUBLISH_URL: rtsp://aegivue-webrtc:8554
    volumes: [aegivue-recordings:/data/recordings]
    healthcheck: {test: [CMD, "wget", "-q", "--spider", "http://127.0.0.1:3010/internal/v1/ready"], interval: 10s, timeout: 3s, retries: 5}
    restart: unless-stopped
    networks: [aegivue-internal, aegivue-cameras, aegivue-stream]

  aegivue-web:
    image: ghcr.io/prinako/aegivue-web:${AEGIVUE_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      aegivue-api: {condition: service_healthy}
      aegivue-media: {condition: service_healthy}
      aegivue-webrtc: {condition: service_started}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports: ["${AEGIVUE_WEB_BIND:-127.0.0.1}:8080:80"]
    networks: [aegivue-public, aegivue-stream]

networks:
  aegivue-internal: {internal: true}
  aegivue-public: {}
  aegivue-cameras: {}
  aegivue-stream: {internal: true}
volumes:
  aegivue-postgres-data: {}
  aegivue-recordings: {}
